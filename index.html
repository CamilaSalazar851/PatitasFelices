<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Patitas felices</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <div class="titulo">
            <img class="logo" src="images/logo.png" alt="Logo de la fundación">
            <h1>Patitas Felices</h1>
        </div>
        <nav class="navegador">
            <a href="#inicio">Inicio</a>
            <a href="#adopta">Adopta</a>
            <a href="#contacto">Contacto</a>
        </nav>

    </header>
    <div class="fondo-header"></div>
    <main>
        <div class="carousel">
            <span>Adopta una mascota</span>
            <span>Ellos también merecen un hogar</span>
            <span>Ayúdanos a salvar vidas</span>
        </div>
        <button>Quiero adoptar</button>
    </main>
    <footer>
        <div class="cont-footer">
            <div class="cont-1">
                <p>Trabajamos cada día para que ningún animal tenga que sufrir el frío de la calle. Únete a nuestra causa y ayúdanos a seguir salvando vidas.</p>
            </div>
            <div class="cont-2">
                <h3>Enlaces rapidos</h3>
            </div>
        </div>
    </footer>
</body>

</html>
